name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-24.04
    # Job-level: skipped events from a review burst would otherwise cancel the
    # mention's run. Keyed on issue/PR number since `github.ref` is always main here.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    # Catches a stalled tool loop; not meant to bound a working run.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      # petasos is public: run only when both the triggering user and the
      # issue/PR author have write access. Not `author_association` — every
      # team member's org membership is private, which can hide MEMBER.
      - name: Ignore users outside the team
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          LOGINS: ${{ github.actor }} ${{ github.event.issue.user.login || github.event.pull_request.user.login }}
        run: |
          for login in $LOGINS; do
            perm=$(gh api "repos/${{ github.repository }}/collaborators/$login/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|write) ;;
              *) echo "::notice::Ignoring $login ($perm access)"; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          done
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        if: steps.gate.outputs.ok == 'true'
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # See claude-code-review.yml.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read

      - name: Upload Claude execution log
        if: ${{ always() && steps.claude.outputs.execution_file != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: claude-execution
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 14
