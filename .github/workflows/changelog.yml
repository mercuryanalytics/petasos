name: Changelog

on:
  push:
    branches: [main]
    paths-ignore:
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog:
    name: Update CHANGELOG
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN pushes can't bypass the 2-approval ruleset on main; the
      # mercury-ci-bot App can. Its pushes do trigger workflows — [skip ci] and
      # paths-ignore above prevent a loop.
      - name: Mint mercury-ci-bot token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CI_BOT_APP_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          # No new conventional commits since last run -> nothing to do.
          git diff --cached --quiet && exit 0
          git commit -m 'docs(changelog): update [skip ci]'
          git push
